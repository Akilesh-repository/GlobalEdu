<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="priyaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="priyaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D99B72"/>
      <stop offset="100%" stop-color="#C28258"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="priyaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261A18"/>
      <stop offset="100%" stop-color="#140C0A"/>
    </linearGradient>

    <!-- Clothes Gradient -->
    <linearGradient id="priyaSweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="120" height="120" rx="60" fill="url(#priyaBg)"/>

  <!-- Back Hair Volume -->
  <ellipse cx="60" cy="58" rx="34" ry="34" fill="url(#priyaHair)"/>
  <path d="M 28 60 Q 22 85 34 105 Q 45 108 50 100 Q 34 80 34 60 Z" fill="url(#priyaHair)"/>
  <path d="M 92 60 Q 98 85 86 105 Q 75 108 70 100 Q 86 80 86 60 Z" fill="url(#priyaHair)"/>

  <!-- Body / Shoulders -->
  <path d="M 22 120 C 22 96 38 88 60 88 C 82 88 98 96 98 120 Z" fill="url(#priyaSweater)"/>

  <!-- Shirt Collar -->
  <polygon points="60,98 48,88 56,86 60,94 64,86 72,88" fill="#F8FAFC"/>
  <!-- Gold Necklace -->
  <path d="M 50 90 Q 60 100 70 90" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="60" cy="95.5" r="1.5" fill="#F59E0B"/>

  <!-- Neck -->
  <path d="M 52 70 L 52 90 Q 60 94 68 90 L 68 70 Z" fill="#B7764C"/>
  <ellipse cx="60" cy="88" rx="8" ry="3" fill="#A4643B" opacity="0.4"/>

  <!-- Face -->
  <ellipse cx="60" cy="58" rx="22" ry="26" fill="url(#priyaSkin)"/>

  <!-- Cheeks Blush -->
  <circle cx="46" cy="64" r="5" fill="#E11D48" opacity="0.18"/>
  <circle cx="74" cy="64" r="5" fill="#E11D48" opacity="0.18"/>

  <!-- Eyebrows -->
  <path d="M 43 47 Q 49 44 55 46" fill="none" stroke="#1F1513" stroke-width="2" stroke-linecap="round"/>
  <path d="M 65 46 Q 71 44 77 47" fill="none" stroke="#1F1513" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="49" cy="53" rx="3.5" ry="3.5" fill="#1A110E"/>
  <ellipse cx="71" cy="53" rx="3.5" ry="3.5" fill="#1A110E"/>
  <circle cx="50" cy="51.8" r="1.2" fill="#FFFFFF"/>
  <circle cx="72" cy="51.8" r="1.2" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M 60 52 L 60 62 Q 62 64 64 63" fill="none" stroke="#A4643B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 50 69 Q 60 79 70 69" fill="#991B1B" stroke="#991B1B" stroke-width="1"/>
  <!-- Teeth -->
  <path d="M 52 69 Q 60 74 68 69" fill="#FFFFFF"/>
  <!-- Smile Outline -->
  <path d="M 49 69 Q 60 80 71 69" fill="none" stroke="#7F1D1D" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Front Hair Details (Curls & Waves) -->
  <path d="M 38 48 C 38 32 50 30 60 30 C 74 30 84 34 84 48 C 84 45 74 36 60 36 C 46 36 38 45 38 48 Z" fill="url(#priyaHair)"/>
  <path d="M 38 46 Q 44 60 38 74 Q 34 60 38 46 Z" fill="url(#priyaHair)"/>
  <path d="M 82 46 Q 76 60 82 74 Q 86 60 82 46 Z" fill="url(#priyaHair)"/>
  <path d="M 42 36 Q 52 44 56 46 Q 50 42 42 36 Z" fill="#3D2925" opacity="0.6"/>

  <!-- Gold Earrings -->
  <circle cx="37.5" cy="62" r="2.5" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="82.5" cy="62" r="2.5" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
</svg>

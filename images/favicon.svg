<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Deep Navy Rounded Container -->
  <rect width="128" height="128" rx="28" fill="#0F172A"/>

  <!-- Globe Base Circle -->
  <circle cx="64" cy="74" r="38" fill="url(#globeGrad)"/>

  <!-- Continents/Grid Accents -->
  <ellipse cx="64" cy="74" rx="20" ry="38" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>
  <line x1="26" y1="74" x2="102" y2="74" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>
  <path d="M 31 60 Q 64 68 97 60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <path d="M 31 88 Q 64 80 97 88" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

  <!-- Academic Mortarboard Skullcap Base -->
  <path d="M 46 44 L 46 54 C 46 64 82 64 82 54 L 82 44 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Mortarboard Diamond Top -->
  <polygon points="64,22 108,40 64,58 20,40" fill="url(#capGrad)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

  <!-- Mortarboard Diamond Highlight Line -->
  <path d="M 27 38 L 64 25 L 101 38" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Button and Tassel -->
  <circle cx="64" cy="40" r="3.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 64 40 C 76 43 85 47 88 56" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 88 56 L 86 67 L 90 67 Z" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
